        <path d="M282 110 H312 V250 H282 Z M282 110 L268 128 H282 Z" fill="#6366f1" />
        <path d="M362 110 C338 110 324 122 324 141 C324 158 336 169 355 175 C333 182 319 196 319 217 C319 242 338 257 367 257 C396 257 415 242 415 217 C415 196 401 182 379 175 C398 169 410 158 410 141 C410 122 396 110 362 110 Z M362 136 C376 136 384 143 384 152 C384 161 376 168 362 168 C348 168 340 161 340 152 C340 143 348 136 362 136 Z M365 190 C381 190 389 198 389 211 C389 224 381 232 365 232 C349 232 341 224 341 224 C341 198 349 190 365 190 Z" fill="#6366f1" />
